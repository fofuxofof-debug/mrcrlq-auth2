  <path d="M79 91V80C79 73.9248 83.9248 69 90 69C96.0752 69 101 73.9248 101 80V91" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="90" cy="103" r="3.5" fill="#ea580c"/>
